# Render Blueprint for the backend (FastAPI + SQLite). The frontend deploys to Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: signal-clone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      # Free plan has no persistent disk: the demo data is re-seeded on every start.
      - key: SEED_ON_START
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false # set to the Vercel URL, e.g. https://signal-clone.vercel.app
