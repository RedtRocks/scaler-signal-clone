# Fly.io config for the backend (alternative to Railway). See docs/DEPLOY.md.
app = "signal-clone-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Set ALLOWED_ORIGINS with: fly secrets set ALLOWED_ORIGINS=https://<your-app>.vercel.app

[mounts]
  source = "signal_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
